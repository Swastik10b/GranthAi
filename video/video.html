<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GranthAI demo video (render source)</title>
<!-- Render source for assets/granthai-demo.mp4. Every scene is a paused GSAP
     timeline; render.js seeks frame by frame and screenshots the stage. -->
<link rel="stylesheet" href="../site/style.css?v=4">
<script src="vendor/gsap.min.js"></script>
<script src="vendor/TextPlugin.min.js"></script>
<style>
  html, body { margin: 0; background: #141B2D; overflow: hidden; scroll-behavior: auto; }
  #stage { width: 1280px; height: 720px; position: relative; overflow: hidden; background: var(--bg); font-family: "Inter", sans-serif; }
  .scene { position: absolute; inset: 0; }
  .chapter { position: absolute; left: 48px; top: 34px; font-size: 14px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--saffron); }
  .brand { position: absolute; right: 44px; top: 26px; display: flex; align-items: center; gap: 8px; }
  .brand img.m { height: 40px; width: auto; } .brand img.w { height: 22px; }
  .h { position: absolute; left: 48px; top: 64px; font-size: 38px; font-weight: 800; color: var(--ink); letter-spacing: -0.5px; line-height: 1.15; max-width: 760px; }
  .serif { font-family: var(--serif); font-weight: 700; }
  .abs { position: absolute; }
  #stage *, #stage *::before, #stage *::after { transition: none !important; animation: none !important; }
  .phone { position: absolute; width: 330px; background: #111; border-radius: 34px; padding: 10px; box-shadow: 0 24px 50px rgba(30,42,68,.28); }
  .phone .scr { background: var(--bg); border-radius: 26px; overflow: hidden; height: 560px; display: flex; flex-direction: column; }
  .phone .app-body { padding: 12px; overflow: hidden; }
  .phone .app-top { padding: 10px 14px; }
  .win { position: absolute; background: #fff; border-radius: 14px; box-shadow: 0 18px 40px rgba(30,42,68,.18); overflow: hidden; }
  .win .bar-top { height: 42px; display: flex; align-items: center; gap: 8px; padding: 0 14px; font-size: 14px; font-weight: 700; border-bottom: 1px solid var(--line); }
  .win .bar-top i { width: 11px; height: 11px; border-radius: 50%; background: #e5e7eb; display: inline-block; }
  .win .content { padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .win .msg { font-size: 15.5px; max-width: 92%; }
  .verdict { position: absolute; font-weight: 800; font-size: 20px; padding: 10px 18px; border-radius: 12px; }
  .big-stat { font-size: 64px; font-weight: 800; letter-spacing: -1.5px; color: var(--ink); line-height: 1; }
  .cap { font-size: 13px; color: var(--faint); }
  .leafbar { position: absolute; height: 58px; border-radius: 29px; background: var(--leaf); display: flex; align-items: center; padding-left: 92px; font-size: 26px; font-weight: 700; color: var(--forest); box-shadow: 0 6px 16px rgba(0,0,0,.06); }
  .tagline { font-family: var(--serif); font-weight: 700; color: var(--ink); }
  .kid { position: absolute; width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .lbl { position: absolute; font-size: 13px; font-weight: 700; color: var(--muted); text-align: center; }
  .cardx { position: absolute; background: #fff; border-radius: 14px; box-shadow: var(--shadow); padding: 16px 18px; }
  .ico { width: 64px; height: 64px; border-radius: 16px; background: var(--alt); display: grid; place-items: center; color: var(--forest); margin-bottom: 14px; }
  .ico svg { width: 34px; height: 34px; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
gsap.registerPlugin(TextPlugin);
const LEAD = 0.45, TAIL = 0.7;
const A = '../site/assets/';
const stage = document.getElementById('stage');
const brand = `<div class="brand"><img class="m" src="${A}logo-mark.png"><img class="w" src="${A}wordmark.png"></div>`;
const brandLight = `<div class="brand"><img class="m" src="${A}logo-tile.png" style="width:40px;height:40px"><img class="w" src="${A}wordmark-light.png"></div>`;
function frac(rows, w = 210) {
  const h = 24, gap = 30; let g = '';
  rows.forEach((f, r) => { const y = r * gap + 3, seg = w / f.d;
    for (let i = 0; i < f.d; i++) g += `<rect x="${i * seg + 1}" y="${y}" width="${seg - 2}" height="${h - 4}" rx="3" fill="${i < f.n ? (f.c || '#7C8BB8') : '#EEF0F6'}"/>`;
    g += `<text x="${w + 10}" y="${y + 15}" font-size="13" font-weight="700" fill="#23304A" font-family="Inter">${f.label}</text>`; });
  return `<svg width="${w + 110}" height="${rows.length * gap + 4}">${g}</svg>`;
}
function radar(vals, size = 260) {
  const D = ['Maker', 'Explorer', 'Creator', 'Helper', 'Leader', 'Organiser'];
  const c = size / 2, r = size / 2 - 42, n = 6, pt = (i, k) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [c + Math.cos(a) * r * k, c + Math.sin(a) * r * k]; };
  let g = ''; [0.33, 0.66, 1].forEach(k => g += `<polygon points="${D.map((_, i) => pt(i, k).join(',')).join(' ')}" fill="none" stroke="#E3E5EF"/>`);
  D.forEach((d, i) => { const [x, y] = pt(i, 1.25); g += `<text x="${x}" y="${y + 4}" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Inter">${d}</text>`; });
  g += `<polygon id="rad" points="${vals.map((v, i) => pt(i, Math.max(.06, v)).join(',')).join(' ')}" fill="rgba(142,59,76,.22)" stroke="#8E3B4C" stroke-width="2.5"/>`;
  return `<svg width="${size}" height="${size}">${g}</svg>`;
}

const SCENES = {

s07_clusters: {
  html: `<div class="scene"><div class="chapter">4 · Interest networks across schools</div>${brand}
    <div class="h" style="font-size:32px">Four schools. One network of shared passions.</div>
    <svg class="abs" id="nw" style="left:48px;top:120px" width="830" height="570"></svg>
    <div class="cardx" id="cl-card" style="left:900px;top:190px;width:330px">
      <span class="type">Aoife’s cluster</span><h3 style="font-size:23px;margin:4px 0 10px">Space Club · 3 schools</h3>
      <div class="member" style="font-size:16px"><i style="background:#8E3B4C"></i>Aoife · St Brigid’s</div><br>
      <div class="member" style="font-size:16px"><i style="background:#34446B"></i>Zofia · Scoil Mhuire</div><br>
      <div class="member" style="font-size:16px"><i style="background:#6d8fb3"></i>Tomás · Holy Family</div><br>
      <div class="member" style="font-size:16px"><i style="background:#34446B"></i>Amara · Scoil Mhuire</div>
      <div class="meta" style="margin-top:14px;font-size:14px">Joint project: design a base on Mars. Teachers supervise every call.</div></div></div>`,
  anim(tl, T) {
    const svg = document.getElementById('nw');
    const SC = [['St Brigid’s', '#8E3B4C'], ['Scoil Mhuire', '#34446B'], ['Holy Family', '#6d8fb3'], ['St Kevin’s', '#9b6bb0']];
    const CL = [['Space club', 205, 150], ['Coding crew', 620, 150], ['Art studio', 205, 420], ['Football & dance', 620, 420]];
    const boxes = [[20, 40], [430, 40], [20, 310], [430, 310]];
    let rs = 7; const rnd = () => (rs = (rs * 16807) % 2147483647) / 2147483647;
    const nodes = [];
    for (let s = 0; s < 4; s++) for (let k = 0; k < 7; k++) {
      const cl = s === 0 && k === 0 ? 0 : (s + k * 3 + Math.floor(k / 2)) % 4;
      nodes.push({ s, cl, x0: boxes[s][0] + 60 + (k % 4) * 82 + (Math.floor(k / 4) ? 40 : 0), y0: boxes[s][1] + 92 + Math.floor(k / 4) * 74, me: s === 0 && k === 0 });
    }
    const cnt = [0, 0, 0, 0];
    nodes.forEach(n => { const i = cnt[n.cl]++, a = i * 2.4 + n.cl, r = i === 0 ? 0 : 30 + 17 * Math.sqrt(i - 1);
      n.x1 = CL[n.cl][1] + Math.cos(a) * r; n.y1 = CL[n.cl][2] + Math.sin(a) * r * 0.85; });
    const edges = [];
    nodes.forEach((a, i) => nodes.forEach((b, j) => { if (j > i && a.cl === b.cl && a.s !== b.s && rnd() < 0.55) edges.push([i, j, a.cl]); }));
    nodes.forEach((a, i) => nodes.forEach((b, j) => { if (j > i && a.cl !== b.cl && rnd() < 0.025) edges.push([i, j, -1]); }));
    const EC = ['#8E3B4C', '#6d8fb3', '#9b6bb0', '#34446B'];
    let g = boxes.map((b, s) => `<g class="sbox"><rect x="${b[0]}" y="${b[1]}" width="380" height="240" rx="16" fill="#fff" stroke="${SC[s][1]}" stroke-width="2"/>
      <path d="M${b[0] + 22} ${b[1] + 40} l14 -12 l14 12 v14 h-28 z" fill="${SC[s][1]}"/><text x="${b[0] + 60}" y="${b[1] + 47}" font-size="17" font-weight="700" font-family="Inter" fill="${SC[s][1]}">${SC[s][0]}</text></g>`).join('');
    g += CL.map((c, k) => `<g class="cring" opacity="0"><circle cx="${c[1]}" cy="${c[2]}" r="112" fill="${k === 0 ? 'rgba(142,59,76,.08)' : 'rgba(124,139,184,.06)'}" stroke="${k === 0 ? '#8E3B4C' : '#D6DAEA'}" stroke-width="2" stroke-dasharray="5 5"/>
      <text x="${c[1]}" y="${c[2] + (k < 2 ? -122 : 136)}" text-anchor="middle" font-size="16" font-weight="700" font-family="Inter" fill="#374151">${c[0]}</text></g>`).join('');
    g += edges.map(([i, j, c], e) => `<line id="e${e}" x1="${nodes[i].x0}" y1="${nodes[i].y0}" x2="${nodes[j].x0}" y2="${nodes[j].y0}" stroke="${c < 0 ? '#D6DAEA' : EC[c]}" stroke-width="${c < 0 ? 1.2 : 2}" opacity="0"/>`).join('');
    g += nodes.map((n, i) => `<circle id="n${i}" cx="${n.x0}" cy="${n.y0}" r="${n.me ? 13 : 10}" fill="${SC[n.s][1]}" stroke="${n.me ? '#141B2D' : '#fff'}" stroke-width="3"/>`).join('');
    g += `<text id="me-t" x="${nodes[0].x0}" y="${nodes[0].y0 - 20}" text-anchor="middle" font-size="14" font-weight="800" font-family="Inter" fill="#141B2D" stroke="#fff" stroke-width="4" paint-order="stroke">Aoife</text>`;
    svg.innerHTML = g;
    tl.from('.h', { opacity: 0, duration: 0.5 }, T(0, 0));
    tl.from('.sbox', { opacity: 0, scale: 0.95, transformOrigin: 'center', stagger: 0.15, duration: 0.4 }, T(0, 0.1));
    tl.from('#nw circle[id^=n]', { scale: 0, transformOrigin: 'center', stagger: 0.03, duration: 0.25 }, T(1, 0));
    tl.from('#me-t', { opacity: 0, duration: 0.3 }, T(1, 0.6));
    const tE = T(2, 0.6);
    edges.forEach((e, k) => tl.to('#e' + k, { opacity: e[2] < 0 ? 0.6 : 0.85, duration: 0.25 }, tE + k * 0.04));
    const tM = tE + edges.length * 0.04 + 0.5, D = 1.8, ease = 'power3.inOut';
    tl.to('.sbox', { opacity: 0.0, duration: 0.6 }, tM);
    nodes.forEach((n, i) => tl.to('#n' + i, { attr: { cx: n.x1, cy: n.y1 }, duration: D, ease }, tM));
    edges.forEach(([i, j], k) => tl.to('#e' + k, { attr: { x1: nodes[i].x1, y1: nodes[i].y1, x2: nodes[j].x1, y2: nodes[j].y1 }, duration: D, ease }, tM));
    tl.to('#me-t', { attr: { x: nodes[0].x1, y: nodes[0].y1 - 20 }, duration: D, ease }, tM);
    tl.to('.cring', { opacity: 1, stagger: 0.25, duration: 0.5 }, tM + D - 0.3);
    tl.from('#cl-card', { opacity: 0, x: 30, duration: 0.6 }, T(3, 0));
    tl.from('#cl-card .member', { opacity: 0, stagger: 0.3, duration: 0.3 }, T(3, 0.5));
  } },

let DUR = null, current = null, WORLD = [];
async function init() { WORLD = await (await fetch('worlddots.json')).json(); DUR = await (await fetch((new URLSearchParams(location.search).get('vo') || '../out/vo') + '/durations.json')).json(); return DUR.map(d => d.id); }
function setup(id) {
  const d = DUR.find(x => x.id === id), sc = SCENES[id];
  stage.innerHTML = sc.html;
  const tl = gsap.timeline({ paused: true });
  const T = (i, dt = 0) => Math.max(0, LEAD + (d.sentences[i] || 0) + dt);
  sc.anim(tl, T);
  const total = LEAD + d.seconds + (id === 's12_close' ? 2.4 : TAIL);
  tl.set({}, {}, total);
  current = tl; tl.seek(0);
  return total;
}
function seek(t) { current.seek(t, false); }
window.V = { init, setup, seek };
