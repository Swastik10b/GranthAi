<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GranthAI demo video (render source)</title>
<!-- Render source for assets/granthai-demo.mp4. Every scene is a paused GSAP
     timeline; render.js seeks frame by frame and screenshots the stage. -->
<link rel="stylesheet" href="../site/style.css">
<script src="vendor/gsap.min.js"></script>
<script src="vendor/TextPlugin.min.js"></script>
<style>
  html, body { margin: 0; background: #0d1712; overflow: hidden; scroll-behavior: auto; }
  #stage { width: 1280px; height: 720px; position: relative; overflow: hidden; background: var(--bg); font-family: "Inter", sans-serif; }
  .scene { position: absolute; inset: 0; }
  .chapter { position: absolute; left: 48px; top: 34px; font-size: 14px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--saffron); }
  .brand { position: absolute; right: 44px; top: 26px; display: flex; align-items: center; gap: 8px; }
  .brand img.m { width: 34px; height: 34px; } .brand img.w { height: 22px; }
  .h { position: absolute; left: 48px; top: 64px; font-size: 38px; font-weight: 800; color: var(--ink); letter-spacing: -0.5px; line-height: 1.15; max-width: 760px; }
  .serif { font-family: var(--serif); font-weight: 700; }
  .abs { position: absolute; }
  #stage *, #stage *::before, #stage *::after { transition: none !important; animation: none !important; }
  .phone { position: absolute; width: 330px; background: #111; border-radius: 34px; padding: 10px; box-shadow: 0 24px 50px rgba(15,26,20,.28); }
  .phone .scr { background: var(--bg); border-radius: 26px; overflow: hidden; height: 560px; display: flex; flex-direction: column; }
  .phone .app-body { padding: 12px; overflow: hidden; }
  .phone .app-top { padding: 10px 14px; }
  .win { position: absolute; background: #fff; border-radius: 14px; box-shadow: 0 18px 40px rgba(15,26,20,.18); overflow: hidden; }
  .win .bar-top { height: 42px; display: flex; align-items: center; gap: 8px; padding: 0 14px; font-size: 14px; font-weight: 700; border-bottom: 1px solid var(--line); }
  .win .bar-top i { width: 11px; height: 11px; border-radius: 50%; background: #e5e7eb; display: inline-block; }
  .win .content { padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .win .msg { font-size: 15.5px; max-width: 92%; }
  .verdict { position: absolute; font-weight: 800; font-size: 20px; padding: 10px 18px; border-radius: 12px; }
  .big-stat { font-size: 64px; font-weight: 800; letter-spacing: -1.5px; color: var(--ink); line-height: 1; }
  .cap { font-size: 13px; color: var(--faint); }
  .leafbar { position: absolute; height: 58px; border-radius: 29px; background: var(--leaf); display: flex; align-items: center; padding-left: 92px; font-size: 26px; font-weight: 700; color: var(--forest); box-shadow: 0 6px 16px rgba(0,0,0,.06); }
  .tagline { font-family: var(--serif); font-weight: 700; color: var(--ink); }
  .kid { position: absolute; width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .lbl { position: absolute; font-size: 13px; font-weight: 700; color: var(--muted); text-align: center; }
  .cardx { position: absolute; background: #fff; border-radius: 14px; box-shadow: var(--shadow); padding: 16px 18px; }
  .ico { width: 64px; height: 64px; border-radius: 16px; background: var(--alt); display: grid; place-items: center; color: var(--forest); margin-bottom: 14px; }
  .ico svg { width: 34px; height: 34px; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
gsap.registerPlugin(TextPlugin);
const LEAD = 0.45, TAIL = 0.85;
const A = '../site/assets/';
const stage = document.getElementById('stage');
const brand = `<div class="brand"><img class="m" src="${A}logo-mark.svg"><img class="w" src="${A}wordmark.svg"></div>`;
const brandLight = `<div class="brand"><img class="m" src="${A}logo-mark.svg"><img class="w" src="${A}wordmark-light.svg"></div>`;
function frac(rows, w = 210) {
  const h = 24, gap = 30; let g = '';
  rows.forEach((f, r) => { const y = r * gap + 3, seg = w / f.d;
    for (let i = 0; i < f.d; i++) g += `<rect x="${i * seg + 1}" y="${y}" width="${seg - 2}" height="${h - 4}" rx="3" fill="${i < f.n ? (f.c || '#6C8577') : '#eef1ee'}"/>`;
    g += `<text x="${w + 10}" y="${y + 15}" font-size="13" font-weight="700" fill="#1f2b24" font-family="Inter">${f.label}</text>`; });
  return `<svg width="${w + 110}" height="${rows.length * gap + 4}">${g}</svg>`;
}
function radar(vals, size = 260) {
  const D = ['Maker', 'Explorer', 'Creator', 'Helper', 'Leader', 'Organiser'];
  const c = size / 2, r = size / 2 - 42, n = 6, pt = (i, k) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [c + Math.cos(a) * r * k, c + Math.sin(a) * r * k]; };
  let g = ''; [0.33, 0.66, 1].forEach(k => g += `<polygon points="${D.map((_, i) => pt(i, k).join(',')).join(' ')}" fill="none" stroke="#dfe6e1"/>`);
  D.forEach((d, i) => { const [x, y] = pt(i, 1.25); g += `<text x="${x}" y="${y + 4}" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Inter">${d}</text>`; });
  g += `<polygon id="rad" points="${vals.map((v, i) => pt(i, Math.max(.06, v)).join(',')).join(' ')}" fill="rgba(192,120,42,.22)" stroke="#c0782a" stroke-width="2.5"/>`;
  return `<svg width="${size}" height="${size}">${g}</svg>`;
}

/* Each scene: html, and anim(tl, T) where T(i, dt) = time of sentence i plus dt. */
const SCENES = {
s01_intro: {
  html: `<div class="scene" style="background:var(--sage)">

      <div class="leafbar" style="left:300px;top:512px;width:680px;background:var(--leaf-2)">People</div>
      <div class="leafbar" style="left:300px;top:584px;width:680px">Opportunity</div>
      <svg class="abs" style="left:300px;top:420px" width="700" height="250"><path id="i-thread" d="M48 8 V 238" stroke="#D9913C" stroke-width="7" stroke-linecap="round" fill="none" stroke-dasharray="240" stroke-dashoffset="240"/>
      <circle cx="48" cy="49" r="7" fill="#1f3a2e" class="hole"/><circle cx="48" cy="121" r="7" fill="#1f3a2e" class="hole"/><circle cx="48" cy="193" r="7" fill="#1f3a2e" class="hole"/></svg>
    </div></div>`,
  anim(tl, T) {
    tl.to('#i-line', { text: { value: 'Every child has a spark.' }, duration: 1.6, ease: 'none' }, T(0, 0.2));
    tl.to('#i-line', { opacity: 0, y: -20, duration: 0.4 }, T(1, -0.4));
    tl.fromTo('#i-logo', { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.8, ease: 'back.out(1.6)' }, T(1, -0.1));
    tl.to('#i-logo', { y: -60, scale: 0.8, duration: 0.6 }, T(2, -0.2));
    tl.fromTo('#i-mean', { opacity: 0, y: 14 }, { opacity: 1, y: -80, duration: 0.6 }, T(2, 0.1));
    tl.from('#i-leaves .leafbar', { opacity: 0, x: -60, stagger: 0.25, duration: 0.6 }, T(3, 0));
    tl.from('.hole', { opacity: 0, stagger: 0.25, duration: 0.3 }, T(3, 0.3));
    tl.to('#i-thread', { strokeDashoffset: 0, duration: 1.4, ease: 'power2.inOut' }, T(3, 1.5));
  } },

s02_problem: {

        <div style="text-align:center"><div class="big-stat" id="p-n2">0%</div><div id="p-b2" style="width:150px;height:0;background:var(--forest);border-radius:8px 8px 0 0;margin-top:12px"></div><div style="font-weight:700;margin-top:10px">All children</div></div>

  anim(tl, T) {
    const svg = document.getElementById('p-svg'); let g = `<circle cx="260" cy="190" r="34" fill="#1f3a2e"/><text x="260" y="197" fill="#fff" font-size="18" font-weight="700" text-anchor="middle" font-family="Inter">Teacher</text>`;
    for (let i = 0; i < 25; i++) { const a = i / 25 * Math.PI * 2, r = 120 + (i % 2) * 42; g += `<circle class="pk" cx="${260 + Math.cos(a) * r * 1.25}" cy="${190 + Math.sin(a) * r * 0.95}" r="13" fill="${i % 5 === 0 ? '#c0782a' : '#8FA79A'}"/>`; }
    svg.innerHTML = g;

    const c1 = { v: 0 }, c2 = { v: 0 }, n1 = document.getElementById('p-n1'), n2 = document.getElementById('p-n2');
    tl.to(c1, { v: 54, duration: 1.2, onUpdate: () => n1.textContent = Math.round(c1.v) + '%' }, T(0, 2.4));
    tl.to('#p-b2', { height: 87 * 2.6, duration: 1.2, ease: 'power2.out' }, T(0, 5.0));
    tl.to(c2, { v: 87, duration: 1.2, onUpdate: () => n2.textContent = Math.round(c2.v) + '%' }, T(0, 5.0));

    tl.from('.pk', { scale: 0, transformOrigin: 'center', stagger: 0.06, duration: 0.3 }, T(1, 0.2));
    tl.to('.pk', { opacity: 0.35, stagger: { each: 0.05, from: 'random' }, duration: 0.3 }, T(1, 4.2));
  } },

s03_profile: {
  html: `<div class="scene"><div class="chapter">1 · Create a profile</div>${brand}
    <div class="h" style="max-width:540px">It starts with a profile.</div>
    <div class="phone" style="left:120px;top:120px"><div class="scr">

      <div class="app-body"><div class="panel" style="margin:0">

    <div class="abs" style="left:640px;top:150px;width:560px;text-align:center" id="pf-right">
      <div style="font-size:20px;font-weight:700;margin-bottom:6px">Aoife’s interest profile</div>
      <div style="display:flex;justify-content:center">${radar([0.15, 0.15, 0.15, 0.15, 0.08, 0.06], 330)}</div>
      <div id="pf-learn" style="margin-top:16px;font-size:18px;color:var(--ink-2)">Explorer mode for age 9: playful, encouraging, short sentences.<br><b>GranthAI starts learning how she learns.</b></div></div></div>`,
  anim(tl, T) {
    tl.from('.phone', { opacity: 0, y: 30, duration: 0.6 }, T(0, 0));
    tl.from('#pf-right', { opacity: 0, duration: 0.6 }, T(0, 0.4));
    tl.to('#pf-name', { text: { value: 'Aoife' }, duration: 0.7, ease: 'none' }, T(1, 0));
    tl.set('#pf-top', { text: 'Aoife' }, T(1, 0.7));
    tl.to('#pf-slide', { left: 22, duration: 0.5 }, T(1, 0.6));
    tl.set('#pf-age', { text: '9' }, T(1, 0.9)); tl.set('#pf-sub', { text: 'Age 9 · Explorer' }, T(1, 0.9));
    const R = (i, k) => { const a = -Math.PI / 2 + i * Math.PI / 3, r = 165 - 42; return [165 + Math.cos(a) * r * k, 165 + Math.sin(a) * r * k]; };
    const poly = v => v.map((k, i) => R(i, Math.max(0.06, k)).join(',')).join(' ');
    [['#c-fb', [0.4, 0.15, 0.15, 0.4, 0.2, 0.06], 0.6], ['#c-sp', [0.4, 1, 0.15, 0.4, 0.2, 0.06], 2.0], ['#c-dr', [0.4, 1, 1, 0.4, 0.2, 0.06], 3.2]].forEach(([id, v, dt]) => {
      tl.set(id, { attr: { 'aria-pressed': 'true' } }, T(2, dt));
      tl.to('#rad', { attr: { points: poly(v) }, duration: 0.5 }, T(2, dt));
    });
    tl.from('#pf-lang', { backgroundColor: '#fbefe0', duration: 0.6 }, T(3, 0.4));
    tl.set('#pf-ck', { backgroundColor: '#1f3a2e', text: '✓' }, T(3, 1.6));

s05_tracing: {
  html: `<div class="scene"><div class="chapter">3 · Learns how she learns</div>${brand}
    <div class="h">Bayesian knowledge tracing, after every answer</div>

  anim(tl, T) {
    const s = document.getElementById('k-svg'); const W = 720, H = 380, x0 = 40;
    const pts = [0.32, 0.18, 0.47, 0.61, 0.74, 0.70, 0.83, 0.89, 0.86, 0.92];
    const xy = pts.map((p, i) => [x0 + i * (W - x0) / (pts.length - 1), 20 + (1 - p) * H]);
    let g = `<line x1="${x0}" y1="${20 + H}" x2="${W}" y2="${20 + H}" stroke="#cfd8d2"/><text x="${x0}" y="${H + 50}" font-size="14" fill="#6b7280" font-family="Inter">Attempts →</text>`;
    [0.25, 0.5, 0.75, 1].forEach(v => g += `<line x1="${x0}" x2="${W}" y1="${20 + (1 - v) * H}" y2="${20 + (1 - v) * H}" stroke="#eef1ee"/><text x="0" y="${25 + (1 - v) * H}" font-size="13" fill="#6b7280" font-family="Inter">${v * 100}%</text>`);
    g += `<path id="k-line" d="M${xy.map(p => p.join(' ')).join(' L')}" fill="none" stroke="#c0782a" stroke-width="3.5" stroke-linejoin="round" stroke-dasharray="1400" stroke-dashoffset="1400"/>`;
    xy.forEach(([x, y], i) => g += `<circle class="kp" cx="${x}" cy="${y}" r="7" fill="${[1, 5, 8].includes(i) ? '#fff' : '#c0782a'}" stroke="#c0782a" stroke-width="3"/>`);
    s.innerHTML = g;
    tl.from('.h', { opacity: 0, duration: 0.5 }, T(0, 0));
    tl.to('#k-line', { strokeDashoffset: 0, duration: 3.2, ease: 'none' }, T(0, 0.4));

    tl.from('#k-cards .panel', { opacity: 0, x: 30, stagger: 0.9, duration: 0.5 }, T(0, 1.6));
  } },

  anim(tl, T) {
    const box = document.getElementById('cl'); const C = ['#c0782a', '#2f5e46', '#6d8fb3', '#9b6bb0'];
    const cent = [[200, 150, 'Space & experiments'], [560, 150, 'Football & dance'], [200, 400, 'Drawing & stories'], [560, 400, 'Robots & coding']];
    let h = ['School A', 'School B', 'School C', 'School D'].map((s, i) => `<div class="lbl sch" style="left:${30 + i * 185}px;top:18px;width:150px;color:${C[i]}">${s}</div>`).join('');
    h += cent.map((c, j) => `<div class="ring abs" style="left:${c[0] - 105}px;top:${c[1] - 95}px;width:210px;height:190px;border-radius:50%;border:2px dashed ${j === 0 ? '#c0782a' : '#cfd8d2'};background:${j === 0 ? 'rgba(192,120,42,.07)' : 'rgba(108,133,119,.05)'}"></div><div class="lbl ring" style="left:${c[0] - 100}px;top:${c[1] + (j < 2 ? -122 : 102)}px;width:200px">${c[2]}</div>`).join('');

    for (let i = 0; i < 28; i++) { const s = i % 4, cl = (i * 7 + Math.floor(i / 4)) % 4; kids.push({ s, cl: i === 0 ? 0 : cl }); }

      k.x0 = 60 + k.s * 185 + (col[k.s] % 3) * 34; k.y0 = 70 + Math.floor(col[k.s] / 3) * 38; col[k.s]++;

let DUR = null, current = null;
async function init() { DUR = await (await fetch('../out/vo/durations.json')).json(); return DUR.map(d => d.id); }
function setup(id) {
  const d = DUR.find(x => x.id === id), sc = SCENES[id];
  stage.innerHTML = sc.html;
  const tl = gsap.timeline({ paused: true });
  const T = (i, dt = 0) => Math.max(0, LEAD + (d.sentences[i] || 0) + dt);
  sc.anim(tl, T);
  const total = LEAD + d.seconds + (id === 's12_close' ? 2.4 : TAIL);
  tl.set({}, {}, total);
  current = tl; tl.seek(0);
  return total;
}
function seek(t) { current.seek(t, false); }
window.V = { init, setup, seek };
</script>
