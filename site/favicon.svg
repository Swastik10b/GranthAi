<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="GranthAI">
  <!-- An open book (knowledge) from which a sapling grows (learning), opening into a lotus bud (talent blooming). -->
  <rect width="64" height="64" rx="15" fill="#1f3a2e"/>
  <g transform="translate(32 31.6) scale(1.1) translate(-32 -30)">
  <!-- stem rising from the spine -->
  <path d="M32 47 C 31.2 39, 33 31, 32 20" stroke="#A9C4B4" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <!-- leaves, growing larger as they rise; each carries lines like a page -->
  <path d="M31.6 40.5 C 26.5 41.5, 20.5 39.5, 17.5 34.2 C 23.5 32.6, 28.6 34.6, 31.6 40.5 Z" fill="#8FA79A"/>
  <path d="M21.5 35.6 L 28.5 38.4" stroke="#1f3a2e" stroke-width="0.9" stroke-linecap="round" opacity=".55"/>
  <path d="M32.4 31.5 C 38.5 32.6, 45.5 29.6, 48.6 22.6 C 41.4 21, 35.4 24, 32.4 31.5 Z" fill="#B7D0C1"/>
  <path d="M36 28.6 L 44.5 24.4 M 38.2 29.6 L 43 27.4" stroke="#1f3a2e" stroke-width="0.9" stroke-linecap="round" opacity=".5"/>
  <!-- lotus bud blooming at the top -->
  <path d="M32 7.8 C 35.6 11, 36.2 15.6, 32 20.2 C 27.8 15.6, 28.4 11, 32 7.8 Z" fill="#E7A75A"/>
  <path d="M32 20.2 C 27.4 19.6, 24.6 16.4, 24.4 12.6 C 28 13, 30.8 15.6, 32 20.2 Z" fill="#D9913C"/>
  <path d="M32 20.2 C 36.6 19.6, 39.4 16.4, 39.6 12.6 C 36 13, 33.2 15.6, 32 20.2 Z" fill="#D9913C"/>
  <circle cx="32" cy="5.2" r="1.3" fill="#F4EBD6"/>
  <!-- the open book -->
  <path d="M32 47.5 C 26 44.2, 17.5 43.4, 9.5 45.4 L 9.5 53.2 C 17.5 51.4, 26 52.2, 32 55.4 Z" fill="#F4EBD6"/>
  <path d="M32 47.5 C 38 44.2, 46.5 43.4, 54.5 45.4 L 54.5 53.2 C 46.5 51.4, 38 52.2, 32 55.4 Z" fill="#E9DDBF"/>
  <path d="M14 48.2 C 19 47.4, 24 47.8, 28.5 49.4 M 35.5 49.4 C 40 47.8, 45 47.4, 50 48.2" stroke="#8FA79A" stroke-width="1.1" stroke-linecap="round" fill="none"/>
  <path d="M32 47.5 V 55.4" stroke="#1f3a2e" stroke-width="1.2"/>
  </g>
</svg>
